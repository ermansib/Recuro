# Recuro sign-in theme for Keycloak (RCU-PLT-001). The password page looks like the next step of the
# portal's sign-in card; base templates for the other pages (update password, one-time code, errors)
# pick up the same look through the class names below. Free and open source like Keycloak (Apache 2.0).
parent=base
locales=en

styles=css/recuro.css
scripts=js/recuro.js

meta=viewport==width=device-width,initial-scale=1

kcFormClass=rc-form
kcFormGroupClass=rc-group
kcLabelWrapperClass=rc-label-wrap
kcLabelClass=rc-label
kcInputWrapperClass=rc-input-wrap
kcInputClass=rc-input
kcTextareaClass=rc-input
kcInputGroup=rc-input-group
kcInputErrorMessageClass=rc-field-error
kcInputHelperTextBeforeClass=rc-help
kcInputHelperTextAfterClass=rc-help
kcFormOptionsClass=rc-options
kcFormOptionsWrapperClass=rc-options
kcFormSettingClass=rc-settings
kcFormButtonsClass=rc-buttons
kcFormButtonsWrapperClass=rc-buttons
kcContentWrapperClass=rc-content
kcSignUpClass=rc-alt
kcButtonClass=rc-btn
kcButtonPrimaryClass=rc-btn-primary
kcButtonDefaultClass=rc-btn-ghost
kcButtonBlockClass=rc-btn-block
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=rc-pw-toggle
kcFormPasswordVisibilityIconShow=rc-eye
kcFormPasswordVisibilityIconHide=rc-eye rc-eye-off
kcAlertClass=rc-alert
kcAlertTitleClass=rc-alert-text
kcFormSocialAccountSectionClass=rc-social
kcFormSocialAccountListClass=rc-social-list
kcFormSocialAccountListButtonClass=rc-btn rc-btn-ghost rc-btn-block
kcLoginOTPListClass=rc-otp-list
kcLoginOTPListInputClass=rc-otp-input
kcLoginOTPListItemHeaderClass=rc-otp-item
kcSelectAuthListClass=rc-select-list
kcSelectAuthListItemClass=rc-select-item
